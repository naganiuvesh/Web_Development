<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            text-align: center;
        }
        header{
            height: 650px;
            width: 300px;
            border: 2px solid black;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center; 
            align-items: center;
            
        }
        header *{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            display: inline-block;
        }
        .box1{
            background-color: aqua;
        }
        .box2{
            background-color: yellow;
        }
        .box3{
            background-color: red;
        }
        .box4{
            background-color: pink;
        }
        /* .box5{
            background-color: green;
        } */

    </style>
</head>
<body>
    <header>
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <!-- <div class="box5"></div> -->
    </header>
</body>
</html>
