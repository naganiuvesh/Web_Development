<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .loader{
            border: 4px solid rgb(101, 89, 89);
            border-left: 4px solid white;
            height: 60px;
            width: 60px;
            position: absolute;
            top: 300px;
            left: 700px;
            border-radius: 50%;
            animation: spin 1.2s ease infinite;
        }

        .text{
            position: absolute;
            top: 375px;
            left: 705px;
        }

        @keyframes spin{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
        
    </style>
</head>
<body>
    <div class="loader"></div>
    <h3 class="text">Loding...</h3>
</body>
</html>
